<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>팀 뽑기</title>

<style>
body {
    font-family: Arial, sans-serif;
    margin: 20px;
    background-color: #f4f4f4;
}

.container {
    max-width: 650px;
    margin: 0 auto;
    background: white;
    padding: 30px;
    border-radius: 8px;
}

.input-group {
    display: flex;
    align-items: center;
    margin-bottom: 15px;
}

.input-group label {
    width: 70px;
    font-weight: bold;
}

.player-inputs {
    display: flex;
    gap: 10px;
    flex: 1;
}

input[type="text"] {
    flex: 1;
    padding: 8px;
}

.fix-box {
    margin-left: 10px;
}

.option-box {
    margin: 15px 0;
}

button {
    width: 100%;
    padding: 12px;
    margin-top: 10px;
    background: #007bff;
    color: white;
    border: none;
    border-radius: 4px;
    cursor: pointer;
}

textarea {
    width: 100%;
    height: 120px;
    margin-top: 20px;
    padding: 10px;
}

.result {
    margin-top: 20px;
    padding: 15px;
    font-weight: bold;
    font-size: 16px; 
    background: #e7f3ff;
}
</style>
</head>
<body>

<div class="container">

<h2>라인별 뽑기</h2>

<div id="sharedInputs"></div>

<div class="option-box">
<label><input type="checkbox" id="allRandomOption"> 전체 랜덤</label>
&nbsp;
<label><input type="checkbox" id="lineRandomOption"> 라인 랜덤</label>
&nbsp;
<label><input type="checkbox" id="teamRandomOption"> 팀 랜덤</label>
</div>

<button onclick="drawLaneTeams()">팀 뽑기</button>

<div class="result">
<p id="team1Display"></p>
<p id="team2Display"></p>
</div>

<textarea id="autoInput" placeholder="탑1 탑2
정글1 정글2
미드1 미드2
원딜1 원딜2
서폿1 서폿2"></textarea>

<button onclick="applyAutoInput()">자동 설정 적용</button>

</div>

<script>

const roles=['탑','정글','미드','원딜','서폿'];
const baseIds=["top","jg","mid","ad","sp"];

function renderSharedInputs(){
    const container=document.getElementById("sharedInputs");
    for(let i=0;i<5;i++){
        container.innerHTML+=`
        <div class="input-group">
            <label>${roles[i]}</label>
            <div class="player-inputs">
                <input type="text" id="${baseIds[i]}1">
                <input type="text" id="${baseIds[i]}2">
            </div>
            <div class="fix-box">
                <label><input type="checkbox" id="fix${i}"> 고정</label>
            </div>
        </div>`;
    }
}
renderSharedInputs();

function shuffleArray(array){
    for(let i=array.length-1;i>0;i--){
        const j=Math.floor(Math.random()*(i+1));
        [array[i],array[j]]=[array[j],array[i]];
    }
}

function drawLaneTeams(){

    const allRandom=document.getElementById("allRandomOption").checked;
    const lineRandom=document.getElementById("lineRandomOption").checked;
    const teamRandom=document.getElementById("teamRandomOption").checked;

    let lanes=[];
    let freePlayers=[];

    for(let i=0;i<5;i++){
        let p1=document.getElementById(baseIds[i]+"1").value.trim();
        let p2=document.getElementById(baseIds[i]+"2").value.trim();
        let fixed=document.getElementById("fix"+i).checked;

        if(!p1||!p2){ alert("모든 입력 필요"); return; }

        lanes.push({
            team1:p1,
            team2:p2,
            fixed:fixed
        });

        if(!fixed){
            freePlayers.push(p1,p2);
        }
    }

    // ✅ 전체 랜덤 (고정 제외)
    if(allRandom){

        shuffleArray(freePlayers);

        let index=0;

        for(let i=0;i<5;i++){
            if(!lanes[i].fixed){
                lanes[i].team1=freePlayers[index++];
                lanes[i].team2=freePlayers[index++];
            }
        }

        applyLanes(lanes);
        return;
    }

    // ✅ 팀 랜덤 (고정 제외 swap)
    if(teamRandom){
        lanes.forEach(l=>{
            if(!l.fixed && Math.random()<0.5){
                [l.team1,l.team2]=[l.team2,l.team1];
            }
        });
    }

    // ✅ 라인 랜덤 (고정 줄은 그대로)
    if(lineRandom){

        let freeLanes=[];
        let fixedMap={};

        for(let i=0;i<5;i++){
            if(lanes[i].fixed){
                fixedMap[i]=lanes[i];
            }else{
                freeLanes.push(lanes[i]);
            }
        }

        shuffleArray(freeLanes);

        let result=[];
        let freeIndex=0;

        for(let i=0;i<5;i++){
            if(fixedMap[i]){
                result.push(fixedMap[i]);
            }else{
                result.push(freeLanes[freeIndex++]);
            }
        }

        lanes=result;
    }

    applyLanes(lanes);
}

function applyLanes(lanes){
    for(let i=0;i<5;i++){
        document.getElementById(baseIds[i]+"1").value=lanes[i].team1;
        document.getElementById(baseIds[i]+"2").value=lanes[i].team2;
    }
    updateResult();
}

function updateResult(){
    let team1=[], team2=[];
    for(let i=0;i<5;i++){
        team1.push(document.getElementById(baseIds[i]+"1").value);
        team2.push(document.getElementById(baseIds[i]+"2").value);
    }

    team1Display.textContent="1팀: "+team1.join(" / ");
    team2Display.textContent="2팀: "+team2.join(" / ");
}

function applyAutoInput(){
    const text=document.getElementById("autoInput").value.trim();
    const lines=text.split("\n");

    if(lines.length!==5){
        alert("5줄 입력해주세요.");
        return;
    }

    for(let i=0;i<5;i++){
        const parts=lines[i].trim().split(/\s+/);
        if(parts.length!==2){
            alert("각 줄에 2명씩 입력해주세요.");
            return;
        }
        document.getElementById(baseIds[i]+"1").value=parts[0];
        document.getElementById(baseIds[i]+"2").value=parts[1];
    }

    updateResult();
}

</script>
</body>
</html>
